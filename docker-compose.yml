services:
  dongxuan-web:
    build: .
    ports:
      - "${DONGXUAN_WEB_PORT:-8000}:8000"
    environment:
      DONGXUAN_LLM_PROVIDER: "${DONGXUAN_LLM_PROVIDER:-openai}"
      DONGXUAN_ACCESS_PASSWORD: "${DONGXUAN_ACCESS_PASSWORD:-}"
      DONGXUAN_MAX_QUESTION_LENGTH: "${DONGXUAN_MAX_QUESTION_LENGTH:-2000}"
      DONGXUAN_MEMORY_PATH: "${DONGXUAN_MEMORY_PATH:-/data/dongxuan/memory.json}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OPENAI_BASE_URL: "${OPENAI_BASE_URL:-https://aivalux.com}"
      OPENAI_MODEL: "${OPENAI_MODEL:-gpt-5.5}"
      OPENAI_WIRE_API: "${OPENAI_WIRE_API:-responses}"
      DONGXUAN_REQUEST_TIMEOUT_SECONDS: "${DONGXUAN_REQUEST_TIMEOUT_SECONDS:-240}"
      DONGXUAN_MAX_OUTPUT_TOKENS: "${DONGXUAN_MAX_OUTPUT_TOKENS:-8192}"
    volumes:
      - ./dongxuan-data:/data/dongxuan
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
