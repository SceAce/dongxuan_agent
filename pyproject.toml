[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "dongxuan-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["sxtwl"]

[project.scripts]
daliuren-chart = "dongxuan_agent.daliuren.cli:main"
bazi-chart = "dongxuan_agent.bazi.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
files = ["dongxuan_agent"]
ignore_missing_imports = true

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.setuptools.package-data]
"dongxuan_agent.resources.prompts" = ["*.md"]

[tool.setuptools.packages.find]
include = ["dongxuan_agent*"]

[dependency-groups]
dev = [
    "mypy>=1.18",
    "pytest>=9.0.3",
    "ruff>=0.12",
]
