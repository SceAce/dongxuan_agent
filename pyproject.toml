[project]
name = "dongxuan-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.136.3",
    "httpx[socks]>=0.28.1",
    "sxtwl",
    "uvicorn>=0.48.0",
]

[project.scripts]
daliuren-chart = "dongxuan_agent.cli:main"
bazi-chart = "dongxuan_agent.bazi.cli:main"
liuyao-chart = "dongxuan_agent.liuyao.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
]
