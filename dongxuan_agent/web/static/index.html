<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>东玄只读测算</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f5f7f4;
        --panel: #ffffff;
        --ink: #18201b;
        --muted: #667266;
        --line: #d9dfd6;
        --accent: #236a58;
        --accent-2: #7a4d1d;
        --danger: #9d2f2f;
        --dark: #101411;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        background: var(--bg);
        color: var(--ink);
        font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        letter-spacing: 0;
      }
      header {
        border-bottom: 1px solid var(--line);
        background: #eef2ea;
      }
      .wrap {
        width: min(1180px, calc(100% - 32px));
        margin: 0 auto;
      }
      .top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding: 18px 0;
      }
      h1 {
        margin: 0;
        font-size: 22px;
        font-weight: 700;
      }
      .status {
        color: var(--muted);
        font-size: 13px;
      }
      main {
        padding: 22px 0 32px;
      }
      .grid {
        display: grid;
        grid-template-columns: minmax(220px, 280px) minmax(320px, 420px) minmax(0, 1fr);
        gap: 18px;
        align-items: start;
      }
      .panel {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 16px;
      }
      .result-panel {
        background: transparent;
        border: 0;
        padding: 0;
      }
      .tabs {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        margin-bottom: 14px;
      }
      .conversation-actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        margin-bottom: 12px;
      }
      .conversation-list {
        display: grid;
        gap: 8px;
      }
      .conversation-item {
        display: grid;
        gap: 4px;
        min-height: 52px;
        text-align: left;
        font-weight: 700;
      }
      .conversation-item small {
        color: var(--muted);
        font-weight: 500;
      }
      .conversation-item.active {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }
      .conversation-item.active small {
        color: rgba(255, 255, 255, 0.78);
      }
      .node-panel {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 12px;
        margin-bottom: 12px;
      }
      .node-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin-bottom: 10px;
      }
      .node-head strong {
        font-size: 15px;
      }
      .node-list {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .node-item {
        display: grid;
        gap: 2px;
        max-width: 180px;
        min-height: 42px;
        text-align: left;
        font-size: 13px;
      }
      .node-item small {
        color: var(--muted);
        font-weight: 500;
      }
      .node-item.active {
        background: var(--accent-2);
        border-color: var(--accent-2);
        color: #fff;
      }
      .node-item.active small {
        color: rgba(255, 255, 255, 0.78);
      }
      button {
        border: 1px solid var(--line);
        background: #f8faf7;
        color: var(--ink);
        border-radius: 6px;
        min-height: 38px;
        padding: 8px 12px;
        cursor: pointer;
        font-weight: 600;
      }
      button.active,
      button.primary {
        background: var(--accent);
        border-color: var(--accent);
        color: #fff;
      }
      button:disabled {
        cursor: wait;
        opacity: 0.7;
      }
      form {
        display: grid;
        gap: 12px;
      }
      label {
        display: grid;
        gap: 6px;
        color: var(--muted);
        font-size: 13px;
      }
      input,
      select,
      textarea {
        width: 100%;
        border: 1px solid var(--line);
        border-radius: 6px;
        background: #fff;
        color: var(--ink);
        font: inherit;
        min-height: 38px;
        padding: 8px 10px;
      }
      textarea {
        min-height: 88px;
        resize: vertical;
      }
      .row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }
      .hidden {
        display: none;
      }
      .result-head {
        display: flex;
        justify-content: space-between;
        gap: 12px;
        align-items: center;
        margin-bottom: 12px;
      }
      h2 {
        margin: 0;
        font-size: 18px;
      }
      .readonly {
        color: var(--accent-2);
        font-size: 13px;
      }
      pre {
        margin: 0;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        font-size: 13px;
        line-height: 1.55;
      }
      .result-stack {
        display: grid;
        gap: 12px;
        margin-bottom: 14px;
      }
      .result-card {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: linear-gradient(180deg, var(--dark) 0, #2f3831 42px, #ffffff 43px, #ffffff 100%);
        overflow: hidden;
      }
      .result-card summary {
        min-height: 42px;
        padding: 11px 14px;
        color: #fff;
        cursor: pointer;
        font-weight: 800;
      }
      .result-card summary::marker {
        color: #fff;
      }
      .result-body {
        padding: 14px 16px 16px;
        background: rgba(255, 255, 255, 0.94);
        color: var(--ink);
        min-height: 72px;
      }
      .card-context {
        --dark: #111817;
      }
      .card-analysis {
        --dark: #1a2230;
      }
      .card-conclusion {
        --dark: #2d2115;
        border-color: #c7b89d;
      }
      .markdown {
        font-size: 14px;
        line-height: 1.75;
      }
      .markdown p,
      .markdown ol,
      .markdown ul,
      .markdown pre {
        margin: 0 0 10px;
      }
      .markdown p:last-child,
      .markdown ol:last-child,
      .markdown ul:last-child,
      .markdown pre:last-child {
        margin-bottom: 0;
      }
      .markdown ol,
      .markdown ul {
        padding-left: 22px;
      }
      .markdown code {
        border: 1px solid var(--line);
        border-radius: 4px;
        background: #f4f6f3;
        padding: 1px 4px;
      }
      .markdown pre {
        border: 1px solid var(--line);
        border-radius: 6px;
        background: #f4f6f3;
        padding: 10px;
        overflow-x: auto;
      }
      details {
        border: 1px solid var(--line);
        border-radius: 6px;
        padding: 10px;
        background: #fbfcfa;
      }
      summary {
        cursor: pointer;
        font-weight: 700;
      }
      .error {
        color: var(--danger);
      }
      @media (max-width: 820px) {
        .grid,
        .row {
          grid-template-columns: 1fr;
        }
        .top {
          align-items: flex-start;
          flex-direction: column;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="wrap top">
        <h1>东玄只读测算</h1>
        <div class="status" id="health">检查服务中...</div>
      </div>
    </header>
    <main class="wrap grid">
      <aside class="panel">
        <div class="conversation-actions">
          <button id="new-conversation" type="button">新建对话</button>
          <button id="delete-conversation" type="button">删除</button>
        </div>
        <div class="conversation-list" id="conversation-list"></div>
      </aside>
      <section class="panel">
        <div class="tabs">
          <button id="tab-bazi" class="active" type="button">八字</button>
          <button id="tab-daliuren" type="button">大六壬</button>
        </div>
        <form id="form">
          <label>
            访问密码
            <input name="password" type="password" autocomplete="current-password" />
          </label>
          <label>
            时间
            <input name="datetime" value="2006-12-18 12:30:00" />
          </label>
          <label>
            时区
            <input name="timezone" value="Asia/Shanghai" />
          </label>
          <div class="row">
            <label>
              性别
              <select name="gender">
                <option value="">未提供</option>
                <option value="男">男</option>
                <option value="女">女</option>
              </select>
            </label>
            <label class="bazi-only">
              子时规则
              <select name="zi_hour_rule">
                <option value="whole">whole</option>
                <option value="split">split</option>
              </select>
            </label>
          </div>
          <div class="row bazi-only">
            <label>
              经度
              <input name="longitude" type="number" step="0.0001" />
            </label>
            <label>
              目标年份
              <input name="target_year" type="number" />
            </label>
          </div>
          <div class="row daliuren-only hidden">
            <label>
              起课方式
              <select name="mode">
                <option value="time">time</option>
                <option value="live-hour">live-hour</option>
                <option value="number">number</option>
              </select>
            </label>
            <label>
              报数
              <input name="number" type="number" />
            </label>
          </div>
          <div class="row daliuren-only hidden">
            <label>
              活时地支
              <input name="hour_branch" />
            </label>
            <label>
              出生年份
              <input name="birth_year" type="number" />
            </label>
          </div>
          <label class="daliuren-only hidden">
            当前背景
            <textarea name="background"></textarea>
          </label>
          <label>
            背景
            <textarea name="case_background"></textarea>
          </label>
          <label>
            已验证事实
            <textarea name="facts" placeholder="一行一条，用户确认过的事实"></textarea>
          </label>
          <label>
            待验证事实
            <textarea name="intents" placeholder="一行一条，当前想验证的问题或假设"></textarea>
          </label>
          <label>
            问题
            <textarea name="question">推断2025年发生了什么</textarea>
          </label>
          <button class="primary" id="submit" type="submit">开始分析</button>
        </form>
      </section>
      <section class="panel result-panel">
        <div class="result-head">
          <h2>分析结果</h2>
          <span class="readonly">只读模式</span>
        </div>
        <div class="node-panel">
          <div class="node-head">
            <strong>问题节点</strong>
            <span class="readonly">当前节点</span>
          </div>
          <div class="node-list" id="node-list"></div>
        </div>
        <div class="result-stack" id="analysis">
          <details class="result-card card-context">
            <summary>确认前置信息</summary>
            <div class="result-body markdown">等待提交。</div>
          </details>
          <details class="result-card card-analysis">
            <summary>分析</summary>
            <div class="result-body markdown">等待提交。</div>
          </details>
          <details class="result-card card-conclusion" open>
            <summary>结论</summary>
            <div class="result-body markdown">等待提交。</div>
          </details>
        </div>
        <details>
          <summary>排盘 JSON</summary>
          <pre id="context"></pre>
        </details>
      </section>
    </main>
    <script>
      const DEFAULT_CONTEXT_TEXT = "";
      const state = { system: "bazi", conversations: [], activeConversationId: null, activeRecordId: null, currentAnalysisRaw: "等待提交。" };
      const form = document.querySelector("#form");
      const submit = document.querySelector("#submit");
      const analysis = document.querySelector("#analysis");
      const context = document.querySelector("#context");
      const conversationList = document.querySelector("#conversation-list");
      const nodeList = document.querySelector("#node-list");

      document.querySelector("#tab-bazi").addEventListener("click", () => switchSystem("bazi"));
      document.querySelector("#tab-daliuren").addEventListener("click", () => switchSystem("daliuren"));
      document.querySelector("#new-conversation").addEventListener("click", () => createConversation());
      document.querySelector("#delete-conversation").addEventListener("click", () => deleteConversation(state.activeConversationId));

      loadConversations().catch((error) => {
        renderAnalysisCards(`## 结论\n<span class="error">${escapeHtml(error.message)}</span>`);
      });

      fetch("/api/health")
        .then((r) => r.json())
        .then((data) => {
          document.querySelector("#health").textContent = `${data.status} / ${data.systems.join("、")} / readonly`;
        })
        .catch(() => {
          document.querySelector("#health").textContent = "服务不可用";
        });

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        submit.disabled = true;
        await saveActiveConversation();
        renderAnalysisCards("分析中...\n\n大模型会先生成编号化公开分析步骤，再给综合判断。复杂盘面可能需要 1-4 分钟。");
        context.textContent = "";
        try {
          const body = buildPayload();
          const endpoint =
            state.activeConversationId && state.system === "bazi"
              ? `/api/cases/${encodeURIComponent(state.activeConversationId)}/bazi/analyze`
              : state.system === "bazi"
                ? "/api/bazi/analyze"
                : "/api/daliuren/analyze";
          const response = await fetch(endpoint, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(body),
          });
          const data = await parseResponse(response);
          if (!response.ok) {
            throw new Error(data.detail || `HTTP ${response.status}`);
          }
          renderAnalysisCards(data.analysis);
          context.textContent = JSON.stringify(data.context, null, 2);
          await saveActiveConversation({ analysis: data.analysis, contextText: context.textContent });
          await refreshActiveConversation();
        } catch (error) {
          renderAnalysisCards(`## 结论\n<span class="error">${escapeHtml(error.message)}</span>`);
          await saveActiveConversation({ analysis: `## 结论\n${error.message}`, contextText: "" });
        } finally {
          submit.disabled = false;
        }
      });

      function switchSystem(system) {
        state.system = system;
        document.querySelector("#tab-bazi").classList.toggle("active", system === "bazi");
        document.querySelector("#tab-daliuren").classList.toggle("active", system === "daliuren");
        document.querySelectorAll(".bazi-only").forEach((el) => el.classList.toggle("hidden", system !== "bazi"));
        document.querySelectorAll(".daliuren-only").forEach((el) => el.classList.toggle("hidden", system !== "daliuren"));
        form.datetime.value = system === "bazi" ? "2006-12-18 12:30:00" : "2026-05-28 20:00:00";
        form.question.value = system === "bazi" ? "推断2025年发生了什么" : "问工作进展";
        saveActiveConversation();
        renderConversationList();
      }

      function buildPayload() {
        const data = Object.fromEntries(new FormData(form).entries());
        const payload = {
          password: emptyToNull(data.password),
          datetime: data.datetime,
          timezone: data.timezone,
          gender: emptyToNull(data.gender),
          question: emptyToNull(data.question),
        };
        if (state.system === "bazi") {
          payload.longitude = numberOrNull(data.longitude);
          payload.zi_hour_rule = data.zi_hour_rule || "whole";
          payload.target_year = integerOrNull(data.target_year);
        } else {
          payload.mode = data.mode || "time";
          payload.hour_branch = emptyToNull(data.hour_branch);
          payload.number = integerOrNull(data.number);
          payload.background = emptyToNull(data.background);
          payload.birth_year = integerOrNull(data.birth_year);
        }
        return Object.fromEntries(Object.entries(payload).filter(([, value]) => value !== null));
      }

      function emptyToNull(value) {
        const trimmed = String(value || "").trim();
        return trimmed ? trimmed : null;
      }

      function numberOrNull(value) {
        const trimmed = String(value || "").trim();
        return trimmed ? Number(trimmed) : null;
      }

      function integerOrNull(value) {
        const number = numberOrNull(value);
        return Number.isFinite(number) ? Math.trunc(number) : null;
      }

      async function loadConversations() {
        const response = await fetch("/api/cases");
        state.conversations = response.ok ? await response.json() : [];
        if (!state.conversations.length) {
          const created = await postJson("/api/cases", buildConversation());
          state.conversations = [created];
        }
        state.activeConversationId = state.conversations[0].id;
        renderConversationList();
        applyActiveConversation();
        renderNodeList();
      }

      function buildConversation(overrides = {}) {
        const now = new Date().toISOString();
        return {
          title: "新的对话",
          system: "bazi",
          formData: defaultFormData("bazi"),
          analysis: "等待提交。",
          contextText: DEFAULT_CONTEXT_TEXT,
          createdAt: now,
          updated_at: now,
          ...overrides,
        };
      }

      function defaultFormData(system) {
        return {
          password: form.password.value || "",
          datetime: system === "bazi" ? "2006-12-18 12:30:00" : "2026-05-28 20:00:00",
          timezone: "Asia/Shanghai",
          gender: "",
          zi_hour_rule: "whole",
          longitude: "",
          target_year: "",
          mode: "time",
          number: "",
          hour_branch: "",
          birth_year: "",
          background: "",
          case_background: "",
          facts: "",
          intents: "",
          question: system === "bazi" ? "推断2025年发生了什么" : "问工作进展",
        };
      }

      async function createConversation() {
        await saveActiveConversation();
        const conversation = await postJson("/api/cases", buildConversation({ title: `对话 ${state.conversations.length + 1}` }));
        state.conversations.unshift(conversation);
        state.activeConversationId = conversation.id;
        applyActiveConversation();
        renderConversationList();
      }

      async function switchConversation(id) {
        if (id === state.activeConversationId) {
          return;
        }
        await saveActiveConversation();
        state.activeConversationId = id;
        state.activeRecordId = null;
        applyActiveConversation();
        renderConversationList();
      }

      async function deleteConversation(id) {
        if (!id || state.conversations.length <= 1) {
          return;
        }
        const index = state.conversations.findIndex((item) => item.id === id);
        await fetch(`/api/cases/${encodeURIComponent(id)}`, {
          method: "DELETE",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ password: emptyToNull(form.password.value) }),
        });
        state.conversations = state.conversations.filter((item) => item.id !== id);
        const next = state.conversations[Math.max(0, index - 1)] || state.conversations[0];
        state.activeConversationId = next.id;
        state.activeRecordId = null;
        applyActiveConversation();
        renderConversationList();
      }

      async function saveActiveConversation(overrides = {}) {
        const conversation = getActiveConversation();
        if (!conversation) {
          return;
        }
        conversation.system = state.system;
        conversation.formData = readFormData();
        conversation.analysis = overrides.analysis ?? state.currentAnalysisRaw ?? conversation.analysis;
        conversation.contextText = overrides.contextText ?? context.textContent ?? "";
        conversation.title = buildConversationTitle(conversation);
        conversation.updated_at = new Date().toISOString();
        const updated = await patchJson(`/api/cases/${encodeURIComponent(conversation.id)}`, casePayloadFromConversation(conversation));
        Object.assign(conversation, updated);
      }

      async function refreshActiveConversation() {
        if (!state.activeConversationId) {
          return;
        }
        const response = await fetch(`/api/cases/${encodeURIComponent(state.activeConversationId)}`);
        const updated = await parseResponse(response);
        if (!response.ok) {
          throw new Error(updated.detail || `HTTP ${response.status}`);
        }
        const index = state.conversations.findIndex((item) => item.id === state.activeConversationId);
        if (index >= 0) {
          state.conversations[index] = updated;
        }
        const records = updated.records || [];
        state.activeRecordId = records[records.length - 1]?.id || null;
        applyActiveConversation();
        renderConversationList();
      }

      function applyActiveConversation() {
        const conversation = getActiveConversation();
        if (!conversation) {
          return;
        }
        switchSystemSilently(conversation.system || "bazi");
        writeFormData(memoryToFormData(conversation));
        const records = conversation.records || [];
        const latest = records[records.length - 1];
        const activeRecord = records.find((record) => record.id === state.activeRecordId) || latest;
        state.activeRecordId = activeRecord?.id || null;
        if (activeRecord) {
          showRecordNode(activeRecord);
        } else {
          renderAnalysisCards(conversation.analysis || "等待提交。");
          context.textContent = conversation.contextText || DEFAULT_CONTEXT_TEXT;
        }
        renderNodeList();
      }

      function readFormData() {
        return Object.fromEntries(new FormData(form).entries());
      }

      function writeFormData(values) {
        for (const [key, value] of Object.entries(values || {})) {
          if (form.elements[key]) {
            form.elements[key].value = value ?? "";
          }
        }
      }

      function casePayloadFromConversation(conversation) {
        const formData = conversation.formData || {};
        return {
          password: emptyToNull(form.password.value),
          title: conversation.title,
          system: conversation.system,
          birth: {
            datetime: formData.datetime || "",
            timezone: formData.timezone || "",
            region: formData.region || "",
            gender: formData.gender || "",
            longitude: numberOrNull(formData.longitude),
            zi_hour_rule: formData.zi_hour_rule || "whole",
          },
          background: formData.case_background || formData.background || "",
          facts: linesToItems(formData.facts, "fact"),
          intents: linesToItems(formData.intents, "intent"),
          notes: conversation.notes || { summary: "" },
        };
      }

      function linesToItems(value, type) {
        return String(value || "")
          .split(/\r?\n/)
          .map((line) => line.trim())
          .filter(Boolean)
          .map((text) => (type === "fact" ? { text, source: "user_verified" } : { text, status: "pending" }));
      }

      function memoryToFormData(conversation) {
        const formData = conversation.formData || defaultFormData(conversation.system || "bazi");
        formData.case_background = conversation.background || "";
        formData.facts = (conversation.facts || []).map((item) => item.text).join("\n");
        formData.intents = (conversation.intents || []).map((item) => item.text).join("\n");
        formData.datetime = conversation.birth?.datetime || formData.datetime;
        formData.timezone = conversation.birth?.timezone || formData.timezone;
        formData.gender = conversation.birth?.gender || formData.gender;
        formData.longitude = conversation.birth?.longitude ?? formData.longitude;
        formData.zi_hour_rule = conversation.birth?.zi_hour_rule || formData.zi_hour_rule;
        return formData;
      }

      function switchSystemSilently(system) {
        state.system = system;
        document.querySelector("#tab-bazi").classList.toggle("active", system === "bazi");
        document.querySelector("#tab-daliuren").classList.toggle("active", system === "daliuren");
        document.querySelectorAll(".bazi-only").forEach((el) => el.classList.toggle("hidden", system !== "bazi"));
        document.querySelectorAll(".daliuren-only").forEach((el) => el.classList.toggle("hidden", system !== "daliuren"));
      }

      function getActiveConversation() {
        return state.conversations.find((item) => item.id === state.activeConversationId);
      }

      function buildConversationTitle(conversation) {
        const question = (conversation.formData?.question || conversation.intents?.[0]?.text || "").trim();
        if (question) {
          return question.slice(0, 18);
        }
        return conversation.system === "daliuren" ? "大六壬对话" : "八字对话";
      }

      function renderConversationList() {
        conversationList.innerHTML = state.conversations
          .map((conversation) => {
            const active = conversation.id === state.activeConversationId ? " active" : "";
            const systemName = conversation.system === "daliuren" ? "大六壬" : "八字";
            const updatedAt = formatDateTime(conversation.updated_at || conversation.updatedAt);
            return `
              <button class="conversation-item${active}" type="button" data-id="${escapeHtml(conversation.id)}">
                <span>${escapeHtml(conversation.title || "未命名对话")}</span>
                <small>${systemName} / ${updatedAt}</small>
              </button>
            `;
          })
          .join("");
        conversationList.querySelectorAll("[data-id]").forEach((button) => {
          button.addEventListener("click", () => switchConversation(button.dataset.id));
        });
      }

      function renderNodeList() {
        const conversation = getActiveConversation();
        const records = conversation?.records || [];
        if (!records.length) {
          nodeList.innerHTML = '<span class="readonly">暂无历史节点</span>';
          return;
        }
        nodeList.innerHTML = records
          .map((record, index) => {
            const active = record.id === state.activeRecordId ? " active" : "";
            const title = record.question || `问题 ${index + 1}`;
            return `
              <button class="node-item${active}" type="button" data-record-id="${escapeHtml(record.id)}">
                <span>${escapeHtml(title.slice(0, 18))}</span>
                <small>${formatDateTime(record.created_at)}</small>
              </button>
            `;
          })
          .join("");
        nodeList.querySelectorAll("[data-record-id]").forEach((button) => {
          button.addEventListener("click", () => {
            const record = records.find((item) => item.id === button.dataset.recordId);
            if (record) {
              showRecordNode(record);
              renderNodeList();
            }
          });
        });
      }

      function showRecordNode(record) {
        state.activeRecordId = record.id;
        form.question.value = record.question || form.question.value;
        renderAnalysisCards(record.analysis || `## 结论\n${record.conclusion || "暂无结论。"}`);
        context.textContent = record.context ? JSON.stringify(record.context, null, 2) : DEFAULT_CONTEXT_TEXT;
      }

      function formatDateTime(value) {
        const date = value ? new Date(value) : new Date();
        if (Number.isNaN(date.getTime())) {
          return "刚刚";
        }
        return `${date.getMonth() + 1}/${date.getDate()} ${String(date.getHours()).padStart(2, "0")}:${String(date.getMinutes()).padStart(2, "0")}`;
      }

      async function postJson(url, payload) {
        const response = await fetch(url, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });
        const data = await parseResponse(response);
        if (!response.ok) {
          throw new Error(data.detail || `HTTP ${response.status}`);
        }
        return data;
      }

      async function patchJson(url, payload) {
        const response = await fetch(url, {
          method: "PATCH",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload),
        });
        const data = await parseResponse(response);
        if (!response.ok) {
          throw new Error(data.detail || `HTTP ${response.status}`);
        }
        return data;
      }

      function renderAnalysisCards(markdownText) {
        state.currentAnalysisRaw = markdownText || "";
        const sections = splitAnalysisSections(markdownText || "");
        analysis.innerHTML = `
          <details class="result-card card-context">
            <summary>确认前置信息</summary>
            <div class="result-body markdown">${renderMarkdown(sections.context)}</div>
          </details>
          <details class="result-card card-analysis">
            <summary>分析</summary>
            <div class="result-body markdown">${renderMarkdown(sections.analysis)}</div>
          </details>
          <details class="result-card card-conclusion" open>
            <summary>结论</summary>
            <div class="result-body markdown">${renderMarkdown(sections.conclusion)}</div>
          </details>
        `;
      }

      function splitAnalysisSections(text) {
        const source = String(text || "").trim();
        const buckets = {
          context: "",
          analysis: "",
          conclusion: "",
        };
        let current = "conclusion";
        const lines = source.split(/\r?\n/);
        for (const line of lines) {
          const heading = line.replace(/^#+\s*/, "").trim();
          if (/^(确认前置信息|前置信息|盘面确认|输入确认)/.test(heading)) {
            current = "context";
            continue;
          }
          if (/^(分析|分析过程|证据链|推导)/.test(heading)) {
            current = "analysis";
            continue;
          }
          if (/^(结论|综合判断|最终结论)/.test(heading)) {
            current = "conclusion";
            continue;
          }
          buckets[current] += `${line}\n`;
        }
        if (!buckets.context.trim() && !buckets.analysis.trim() && source) {
          const parts = source.split(/\n{2,}/);
          buckets.context = parts.slice(0, 1).join("\n\n");
          buckets.analysis = parts.slice(1, -1).join("\n\n");
          buckets.conclusion = parts.slice(-1).join("\n\n");
        }
        return {
          context: buckets.context.trim() || "未单独输出前置信息。",
          analysis: buckets.analysis.trim() || "未单独输出分析过程。",
          conclusion: buckets.conclusion.trim() || source || "暂无结论。",
        };
      }

      function renderMarkdown(markdownText) {
        const blocks = [];
        const lines = String(markdownText || "").split(/\r?\n/);
        let paragraph = [];
        let list = null;
        let code = [];
        let inCode = false;

        const flushParagraph = () => {
          if (paragraph.length) {
            blocks.push(`<p>${renderInline(paragraph.join(" "))}</p>`);
            paragraph = [];
          }
        };
        const flushList = () => {
          if (list) {
            blocks.push(`<${list.type}>${list.items.map((item) => `<li>${renderInline(item)}</li>`).join("")}</${list.type}>`);
            list = null;
          }
        };

        for (const rawLine of lines) {
          const line = rawLine.trimEnd();
          if (line.startsWith("```")) {
            if (inCode) {
              blocks.push(`<pre><code>${escapeHtml(code.join("\n"))}</code></pre>`);
              code = [];
              inCode = false;
            } else {
              flushParagraph();
              flushList();
              inCode = true;
            }
            continue;
          }
          if (inCode) {
            code.push(rawLine);
            continue;
          }
          if (!line.trim()) {
            flushParagraph();
            flushList();
            continue;
          }
          if (/^#{1,4}\s+/.test(line)) {
            flushParagraph();
            flushList();
            const level = Math.min(line.match(/^#+/)[0].length + 2, 5);
            blocks.push(`<h${level}>${renderInline(line.replace(/^#{1,4}\s+/, ""))}</h${level}>`);
            continue;
          }
          const ordered = line.match(/^\d+[.、]\s+(.+)/);
          const unordered = line.match(/^[-*]\s+(.+)/);
          if (ordered || unordered) {
            flushParagraph();
            const type = ordered ? "ol" : "ul";
            const item = ordered ? ordered[1] : unordered[1];
            if (!list || list.type !== type) {
              flushList();
              list = { type, items: [] };
            }
            list.items.push(item);
            continue;
          }
          paragraph.push(line.trim());
        }
        flushParagraph();
        flushList();
        if (inCode) {
          blocks.push(`<pre><code>${escapeHtml(code.join("\n"))}</code></pre>`);
        }
        return blocks.join("");
      }

      function renderInline(value) {
        return escapeHtml(value)
          .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>")
          .replace(/`([^`]+)`/g, "<code>$1</code>");
      }

      async function parseResponse(response) {
        const text = await response.text();
        if (!text) {
          return {};
        }
        try {
          return JSON.parse(text);
        } catch {
          return { detail: text.slice(0, 500) };
        }
      }

      function escapeHtml(value) {
        return String(value).replace(/[&<>"']/g, (char) => ({
          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#039;",
        }[char]));
      }
    </script>
  </body>
</html>
